name: salesflow_mobile
description: SalesFlow Pro Congo - application mobile
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management - Cubit (BLoC simplifié)
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # HTTP client
  dio: ^5.7.0

  # Stockage sécurisé pour le JWT (Keychain iOS / EncryptedSharedPreferences Android)
  flutter_secure_storage: ^9.2.2

  # Lancer des liens externes (WhatsApp, navigateur, téléphone)
  url_launcher: ^6.3.1

  # PDF / partage natif
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  share_plus: ^10.1.2

  # Caméra et galerie photos (module Coffre-Fort)
  image_picker: ^1.1.2

  # Formatage (dates, monnaie XAF)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
