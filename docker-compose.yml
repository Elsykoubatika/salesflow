services:
  postgres:
    image: postgres:16-alpine
    container_name: salesflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: salesflow
      POSTGRES_PASSWORD: salesflow_dev_pwd
      POSTGRES_DB: salesflow
    ports:
      - "5432:5432"
    volumes:
      - salesflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesflow -d salesflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin - interface web pour explorer la BDD (optionnel)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: salesflow_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@salesflow.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  salesflow_pgdata:
    name: salesflow_pgdata
